name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Testy i budowanie
        run: ./gradlew --no-daemon testDebugUnitTest :app:assembleRelease :nettools:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: vlsm-wear-apk
          path: app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: nettools-apk
          path: nettools/build/outputs/apk/release/nettools-release.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zrzuty-ekranow
          path: |
            app/build/screenshots/
            nettools/build/screenshots/
